<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SHOEX</title>
    <link rel="stylesheet" href="/design.css">
</head>

<body>
    <!-- navbar -->
    <nav class="navbar">
        <h2>SHOEX</h2>

        <div class="menu">
            <a href="#home">HOME</a>
            <a href="#product">Product</a>
            <a href="#About">About</a>
            <a href="#contact">Contact</a>
        </div>
    </nav>

    <!-- home -->
    <section id="home" class="hero">
        <div id="hero-text">
            <h1>Step Into Style</h1>
            <p>Discover your perfect shoes.</p>
            <a href="#product" class="btn">Shop Now</a>
        </div>
        <img src="./imgs/images6.jpg" alt="">
    </section>
    <!-- product -->
    <section id="product">
        <h2>Our Products</h2>
        <div class="product">
            <div class="card">
                <img src="./imgs/images (2).jpg">
                <h3>Sport Shoe</h3>
                <p>₹1,999</p>
                <button>Buy Now</button>
            </div>

            <div class="card">
                <img src="./imgs/images (1).jpg">
                <h3>Casul Shoe</h3>
                <p>₹2,999</p>
                <button>Buy Now</button>
            </div>

            <div class="card">
                <img src="./imgs/images (3).jpg">
                <h3>Runing Shoe</h3>
                <p>₹3,999</p>
                <button>Buy Now</button>
            </div>



        </div>










    </section>

















</body>

</html>
